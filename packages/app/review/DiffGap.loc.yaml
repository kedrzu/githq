lines:
  plural: count
  en:
    one: 1 line
    many: '{formatted} lines'
linesAbove:
  plural: count
  en:
    one: 1 line above
    many: '{formatted} lines above'
linesBelow:
  plural: count
  en:
    one: 1 line below
    many: '{formatted} lines below'
expansionReset:
  en: Context you expanded here was reset by the push · {lines}
expansionResetOnly:
  en: Context you expanded here was reset by the push
showBelow:
  en: Show {count} below line {line}
showAbove:
  en: Show {count} above line {line}
showAll:
  plural: count
  en:
    one: Show 1 line
    many: Show {formatted} lines
enterShowsBelow:
  en: ↵ shows {count} below line {line}
enterShowsAbove:
  en: ↵ shows {count} above line {line}
enterShowsAll:
  plural: count
  en:
    one: ↵ shows 1 line
    many: ↵ shows {formatted} lines
