# Runs the deploy's checks on a pull request before it merges, so a red that only shows on Linux never reaches main.
# Nothing runs on a draft: agents push to drafts while they work and mark the PR ready when they have finished
# (`.claude/skills/git-workflow/SKILL.md`). `pull_request`, never `pull_request_target`: a fork's code runs with no
# secret, no environment and a read-only token.
name: PR checks

on:
  pull_request:
    # Not `edited`: a title or description edit must not cancel running tests. `pr-title.yml` handles title edits, and
    # `converted_to_draft` is here so that turning a PR back into a draft cancels its run.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A bad title, or a title the changes contradict, fails here and nothing after it starts. Otherwise the changes alone
  # decide whether the code checks run, whatever the title's type.
  scope:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.title.outputs.code }}
    steps:
      # A pull request's checkout is the merge commit, so its first parent is the base and the diff is the PR's change.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: List the changed files
        run: git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/files"

      - name: Check the title against them
        id: title
        run: bun packages/app/scripts/release.ts check-title "$TITLE" --files "$RUNNER_TEMP/files"
        env:
          TITLE: ${{ github.event.pull_request.title }}

  # No code changed, so only what can check Markdown and the like: the same commands as the Lint and Format of the
  # full checks.
  format:
    needs: scope
    if: ${{ needs.scope.outputs.code == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

  full:
    needs: scope
    if: ${{ needs.scope.outputs.code != 'false' }}
    uses: ./.github/workflows/checks.yml

  # One result under one name, whichever path the run took: this is the check `main`'s ruleset requires. A required
  # `full / static` could not work, because a skipped caller job never reports the called jobs' names. `full` itself
  # fails when any called job does, each e2e shard included.
  checks:
    needs: [scope, format, full]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One of the two paths passed
        run: |
          if [ "$SCOPE" = success ] && { { [ "$CODE" = false ] && [ "$FORMAT" = success ]; } ||
            { [ "$CODE" != false ] && [ "$FULL" = success ]; }; }; then
            exit 0
          fi
          echo "::error::scope: $SCOPE (code: $CODE), format: $FORMAT, full: $FULL"
          exit 1
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          FORMAT: ${{ needs.format.result }}
          FULL: ${{ needs.full.result }}
