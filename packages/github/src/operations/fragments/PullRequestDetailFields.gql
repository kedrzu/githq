# What the opened pull request shows beyond its row (D18): the full check list, reviews and commits on top of the
# issue-like details. The row fields come along, so opening a pull request refreshes its row.
fragment PullRequestDetailFields on PullRequest {
    ...PullRequestFields
    body
    bodyHTML
    lastEditedAt
    # GitHub says whether the viewer may edit the description (K1b).
    viewerCanUpdate
    # Locked to collaborators: only people with write access may comment (`getEditPermissions`).
    locked
    reactionGroups {
        ...ReactionGroupFields
    }
    # Aliased: the row's `comments` has no arguments. The newest page; older ones through `MoreComments`.
    commentPage: comments(last: 50) {
        ...CommentPageFields
    }
    # The first two comments, which a thread shows above its fold (F5) however many come after them.
    firstComments: comments(first: 2) {
        nodes {
            ...IssueCommentFields
        }
    }
    # The thread's events (item-activity F13), comments and reviews apart: the first two and the newest 50, oldest
    # first; what lies between is read on demand (`ThreadMiddle`). `$pullRequestEventTypes` is `THREAD_EVENT_TYPES`
    # (`ItemDetailStore`). Counts are `filteredCount`: with `itemTypes`, a pull request's `totalCount` counts its
    # whole timeline (kedrzu/githq#219: 65, 55 of them commits). Each event's cursor (`edges`): the middle is read from
    # one older than the last of the first and up to one newer than the first of the newest (`toItemEvents`).
    firstEvents: timelineItems(first: 2, itemTypes: $pullRequestEventTypes) {
        edges {
            cursor
        }
        nodes {
            ...ThreadEventFields
        }
    }
    lastEvents: timelineItems(last: 50, itemTypes: $pullRequestEventTypes) {
        filteredCount
        edges {
            cursor
        }
        nodes {
            ...ThreadEventFields
        }
    }
    # How many of the events are commits, for the fold's counts (F5); the rest are other events.
    commitEvents: timelineItems(itemTypes: [PULL_REQUEST_COMMIT]) {
        filteredCount
    }
    commits {
        totalCount
    }
    headRepository {
        nameWithOwner
    }
    statusCheckRollup {
        # Aliased: the row's `contexts` reads only the counts.
        contextPage: contexts(first: 100) {
            totalCount
            nodes {
                ...PullRequestCheckFields
            }
        }
    }
    latestReviews(first: 20) {
        nodes {
            author {
                login
                avatarUrl
            }
            state
            submittedAt
        }
    }
    # Every submitted review for the conversation beside the diff, unlike `latestReviews`' one per reviewer. Each reply to a
    # thread is a review of its own, hence GitHub's most at once rather than the 50 of `commentPage`.
    # Older ones through `MoreReviews`.
    reviews(last: 100, states: [APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED]) {
        ...ReviewPageFields
    }
    # Merges with the row's `reviewRequests(first: 10)`, adding the reviewers' avatars.
    reviewRequests(first: 10) {
        nodes {
            requestedReviewer {
                ... on User {
                    avatarUrl
                }
            }
        }
    }
    # Merges with the row's `projectItems(first: 10)`, archived items included (`isArchived`, hidden per D13).
    projectItems(first: 10) {
        nodes {
            ...ProjectItemDetailFields
        }
    }
}
