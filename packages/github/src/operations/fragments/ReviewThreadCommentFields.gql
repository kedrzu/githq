# A comment of a review thread. `bodyHTML` is what is shown: GitHub rendered and sanitized it, nothing here does.
fragment ReviewThreadCommentFields on PullRequestReviewComment {
    id
    author {
        login
        avatarUrl
    }
    bodyHTML
    createdAt
    url
    diffHunk
    outdated
    # `PENDING` while in the viewer's draft review, which only they can read.
    state
    originalCommit {
        oid
        abbreviatedOid
    }
    pullRequestReview {
        id
    }
}
