  en: Open on GitHub
watchOnGitHub:
  en: Watch on GitHub
runningTitle:
  en: '{job} is still running'
waitingTitle:
  en: "{job} hasn't started yet"
runningText:
  en: "GitHub doesn't stream a running job's log to githq. It lands here the moment the job finishes; until then, watch it live on GitHub."
runningDetail:
  en: 'status: {status} · {duration}'
waitingDetail:
  en: 'status: {status}'
goneTitle:
  en: This log was garbage-collected
goneFailedAt:
  en: 'It failed at {step}.'
goneOld:
  en: 'GitHub keeps logs for 90 days by default and this run is {days} days old. The next failed run brings a fresh one.'
goneYoung:
  en: 'GitHub has no log for this job, though it keeps logs for 90 days by default; a repository can keep them for less. The next failed run brings a fresh one.'
goneDetail:
  en: 'retention 90d · run age {days}d'
failedTitle:
  en: "The log of {job} didn't load"
failedText:
  en: "GitHub answered {status}, which happens to the best of servers. Other jobs' logs still open with ⌥J and ⌥K."
failedNoAnswerText:
  en: "GitHub didn't answer, or githq has used up its allowance for now. Other jobs' logs still open with ⌥J and ⌥K."
failedDetail:
  en: 'GET …/jobs/{id}/logs → {status}'
failedNoAnswerDetail:
  en: 'GET …/jobs/{id}/logs → no answer'
neverRanTitle:
  en: '{job} never ran'
neverRanText:
  en: "It never started, so there's no log to read."
neverRanDetail:
  en: 'conclusion: {conclusion}'
search:
  en: Search
match:
  en: Match
nextMatch:
  en: Next match
previousMatch:
  en: Previous
copyLineLink:
  en: Copy link to line
showInFullLog:
  en: Show in the full log
openGap:
