# Checks that a pull request's title is a Conventional Commit. PRs are squash-merged, so the title becomes the
# commit on main, and the commits since the last stable tag decide the version and the release notes of the
# desktop app (`release.yml`). The convention is in `.claude/skills/git-workflow/SKILL.md`.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check the title
        run: bun packages/app/scripts/release.ts check-title "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
