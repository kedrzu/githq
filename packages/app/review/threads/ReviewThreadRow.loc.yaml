placedAgain:
  en: placed by finding its line again, so the place is approximate
atFileTop:
  en: shown at the top of the file with the code it was written on
withItsCode:
  en: shown with the code it was written on
lineGone:
  en: Outdated, its line is gone
lineGoneDetail:
  en: written on line {line} at {commit}; that line can't be found once in the file now
codeAtCommit:
  en: The code it was written on, at {commit}
asCommented:
  en: Line {line}, as it was when commented
asCommentedAt:
  en: Line {line}, as it was when commented at {commit}
