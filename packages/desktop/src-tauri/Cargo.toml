[package]
name = "githq"
version = "0.1.0"
description = "githq desktop app: the githq SPA in a native window"
license = "AGPL-3.0-only"
repository = "https://github.com/kedrzu/githq"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
