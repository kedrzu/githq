# An issue's or pull request's place in a project, with the default row field "Status" (D12).
fragment ItemProjectItemFields on ProjectV2Item {
    id
    isArchived
    updatedAt
    project {
        id
        title
        number
        url
    }
    fieldValueByName(name: "Status") {
        ... on ProjectV2ItemFieldSingleSelectValue {
            name
            color
            optionId
        }
    }
}
