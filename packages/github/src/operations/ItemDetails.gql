# The details of several items at once, prefetched for "my work" in the background (D18); at most 10 ids per call.
# The event types are `THREAD_EVENT_TYPES` (`ItemDetailStore`).
query ItemDetails(
    $ids: [ID!]!
    $issueEventTypes: [IssueTimelineItemsItemType!]!
    $pullRequestEventTypes: [PullRequestTimelineItemsItemType!]!
) {
    nodes(ids: $ids) {
        ... on Issue {
            ...IssueDetailFields
        }
        ... on PullRequest {
            ...PullRequestDetailFields
        }
    }
}
