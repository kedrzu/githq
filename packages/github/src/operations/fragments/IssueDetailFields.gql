# What the opened issue shows beyond its row (D18); the row fields come along, so opening an issue refreshes its row.
fragment IssueDetailFields on Issue {
    ...IssueFields
    body
    bodyHTML
    lastEditedAt
    # GitHub says whether the viewer may edit the description (K1b).
    viewerCanUpdate
    # Locked to collaborators: only people with write access may comment (`getEditPermissions`).
    locked
    reactionGroups {
        ...ReactionGroupFields
    }
    # Aliased: the row's `comments` has no arguments. The newest page; older ones through `MoreComments`.
    commentPage: comments(last: 50) {
        ...CommentPageFields
    }
    # The first two comments, which a thread shows above its fold (F5) however many come after them.
    firstComments: comments(first: 2) {
        nodes {
            ...IssueCommentFields
        }
    }
    # The thread's events (item-activity F13), comments and reviews apart: the first two and the newest 50, oldest
    # first; what lies between is read on demand (`ThreadMiddle`). `$issueEventTypes` is `THREAD_EVENT_TYPES`
    # (`ItemDetailStore`). Counts are `filteredCount`: with `itemTypes`, a pull request's `totalCount` counts its
    # whole timeline (kedrzu/githq#219: 65, 55 of them commits).
    firstEvents: timelineItems(first: 2, itemTypes: $issueEventTypes) {
        pageInfo {
            endCursor
        }
        nodes {
            ...ThreadEventFields
        }
    }
    lastEvents: timelineItems(last: 50, itemTypes: $issueEventTypes) {
        filteredCount
        pageInfo {
            startCursor
        }
        nodes {
            ...ThreadEventFields
        }
    }
    parent {
        ...LinkedIssueFields
    }
    subIssues(first: 50) {
        totalCount
        nodes {
            ...LinkedIssueFields
        }
    }
    blockedBy(first: 20) {
        totalCount
        nodes {
            ...LinkedIssueFields
        }
    }
    blocking(first: 20) {
        totalCount
        nodes {
            ...LinkedIssueFields
        }
    }
    # Merges with the row's `projectItems(first: 10)`, archived items included (`isArchived`, hidden per D13).
    projectItems(first: 10) {
        nodes {
            ...ProjectItemDetailFields
        }
    }
}
