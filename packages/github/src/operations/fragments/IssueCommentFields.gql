# A comment as the item view shows it; `bodyHTML` is GitHub's own rendering, sanitized by GitHub, `body` the Markdown an
# edit starts from. GitHub says whether the viewer may edit or delete it (K1b).
fragment IssueCommentFields on IssueComment {
    id
    url
    createdAt
    lastEditedAt
    author {
        login
        avatarUrl
    }
    body
    bodyHTML
    viewerCanUpdate
    viewerCanDelete
}
