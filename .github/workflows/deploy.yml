# Deploys githq to https://githq.dev on every push to main, once the checks (`checks.yml`) have passed on that commit.
# The desktop app itself is released on demand by the action in `release.yml`; `development.yml` builds it after this.
# The Cloudflare API token is a secret of the `production` environment; the account is in `wrangler.jsonc`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order: a later push waits instead of cancelling one already deploying.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://githq.dev
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Build
        run: bash setup.build.sh

      - name: Build the app
        run: bun --cwd packages/app build

      - name: Deploy
        run: bun --cwd packages/worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
