# Builds the desktop app (packages/desktop) into a draft release that already exists: the SPA once, then each platform,
# which uploads its installers and signed updater bundles, then the release's `latest.json` from what they uploaded. Called
# by `release.yml` and `development.yml`.
#
# The actions in `bundle` that hold the secrets are pinned by commit, because a moved tag would reach the key every update
# is trusted by.
#
# Secrets: `TAURI_SIGNING_PRIVATE_KEY` and `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` sign the updater bundles (the public half
# is `plugins.updater.pubkey` in `tauri.conf.json`). The Apple ones (`APPLE_CERTIFICATE`, `APPLE_CERTIFICATE_PASSWORD`,
# `APPLE_SIGNING_IDENTITY`, `APPLE_ID`, `APPLE_PASSWORD`, `APPLE_TEAM_ID`) sign and notarize the macOS app; without them it
# is ad-hoc signed (`bundle.macOS.signingIdentity: "-"`), which macOS opens as from an "unidentified developer".
# `APPLE_PROVISIONING_PROFILE` (base64) adds Universal Links to a signed macOS app; without it the app has none.
name: Desktop build

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      tag:
        description: The release's tag, which names it in `latest.json`'s download URLs
        type: string
        required: true
      version:
        description: The version written into the app and its files
        type: string
        required: true
      release-id:
        description: The draft release to upload to
        type: string
        required: true
      platforms:
        description: JSON list of the platforms to build, each with its runner, target and tauri args
        type: string
        required: true

permissions:
  contents: read

jobs:
  # The app the desktop window loads, built once for every platform: it is the same static files everywhere.
  spa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Build
        run: bash setup.build.sh

      - name: Build the desktop app's SPA
        run: bun --cwd packages/app build:desktop
        env:
          # The production OAuth App the desktop sign-in (Device Flow) uses.
          GITHQ_ENV: prod

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-spa
          path: packages/app/.output-desktop/public
          if-no-files-found: error

  bundle:
    needs: spa
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: desktop-spa
          path: packages/app/.output-desktop/public

      # Tauri v2's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux), patchelf for the AppImage.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # The version; the SPA is already built, so no `beforeBuildCommand`; and the signed updater bundles, left out of the
      # committed config so a local build needs no signing key. The Tauri CLI is the version `packages/desktop` pins, run
      # through npx: no `bun install` of the whole workspace for it.
      - name: Configure the release build
        id: configure
        shell: bash
        run: |
          config=packages/desktop/src-tauri/tauri.conf.json
          jq --arg version "$VERSION" \
            '.version = $version | del(.build.beforeBuildCommand) | .bundle.createUpdaterArtifacts = true' \
            "$config" > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" "$config"
          echo "cli=$(jq -r '.devDependencies["@tauri-apps/cli"]' packages/desktop/package.json)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      # Apple signing and notarization only with the secrets set: an empty `APPLE_CERTIFICATE` in the environment
      # counts as present and fails the bundle (tauri-apps/tauri-action#234). The heredoc form keeps a multi-line
      # value intact; values are never printed.
      - name: Use the Apple signing secrets that are set
        if: runner.os == 'macOS'
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 16)"
              {
                echo "$name<<$delimiter"
                printf '%s\n' "$value"
                echo "$delimiter"
              } >> "$GITHUB_ENV"
              echo "$name: set"
            fi
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Universal Links only in an app signed with the Developer ID and carrying the profile: macOS kills at launch an app
      # with the Associated Domains entitlement and no profile authorising it, so none of this is in the committed config.
      # A profile for another certificate or App ID fails the build here, before such an app reaches the updater.
      - name: Use the Universal Links profile if it is set
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE" ] || [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Universal Links: off"
            exit 0
          fi

          tauri=packages/desktop/src-tauri
          printf %s "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$tauri/embedded.provisionprofile"

          # The signing certificate out of the .p12; OpenSSL 3 reads one exported with older ciphers only with `-legacy`.
          printf %s "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          { openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -clcerts 2>/dev/null ||
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -clcerts; } |
            openssl x509 -outform DER > "$RUNNER_TEMP/certificate.der"
          rm "$RUNNER_TEMP/certificate.p12"
          packages/desktop/scripts/check-provisioning-profile.sh \
            "$tauri/embedded.provisionprofile" "$RUNNER_TEMP/certificate.der" "$tauri/Entitlements.plist"

          jq '.bundle.macOS.files["embedded.provisionprofile"] = "./embedded.provisionprofile"
            | .bundle.macOS.entitlements = "Entitlements.plist"
            | .plugins["deep-link"].desktop.domains = ["githq.dev"]' \
            "$tauri/tauri.conf.json" > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" "$tauri/tauri.conf.json"
          echo "Universal Links: on"
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Picks the client ID compiled into the app (`build.rs`), as it does for the SPA.
          GITHQ_ENV: prod
          # The commit the app says it was built from (`build.rs`, `updater.rs`).
          GITHQ_COMMIT: ${{ inputs.ref }}
          # aws-lc-sys (rustls, through reqwest) assembles with NASM on x86_64 Windows, which the runner lacks;
          # this uses its prebuilt objects instead. Ignored on every other target.
          AWS_LC_SYS_PREBUILT_NASM: 1
        with:
          projectPath: packages/desktop
          tauriScript: npx --yes @tauri-apps/cli@${{ steps.configure.outputs.cli }}
          args: ${{ matrix.args }}
          releaseId: ${{ inputs.release-id }}
          releaseDraft: true
          # `updater-manifest` writes it: tauri-action reads the file, deletes it and uploads its own, so builds finishing at
          # once lose each other's platforms or fail (#173).
          includeUpdaterJson: false

  # After every platform, so it is the only writer. A failed build skips it, and "Re-run failed jobs" runs it then.
  updater-manifest:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Drafts are visible only with write access.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release-id }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # By asset ID: a draft can't be downloaded by its tag, which `development` shares with the published release.
      - name: Compose latest.json from the uploaded bundles and signatures
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate > "$RUNNER_TEMP/assets.json"
          mkdir "$RUNNER_TEMP/signatures"
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' "$RUNNER_TEMP/assets.json" |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/signatures/$name"
            done
          bun packages/app/scripts/release.ts updater-manifest \
            --version "$VERSION" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --assets "$RUNNER_TEMP/assets.json" \
            --signatures "$RUNNER_TEMP/signatures" \
            --out "$RUNNER_TEMP/latest.json"

      # A re-run replaces the one the last attempt left.
      - name: Upload latest.json
        run: |
          asset_id=$(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/assets.json")
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          fi
          gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            -H 'Content-Type: application/json' --input "$RUNNER_TEMP/latest.json" --jq .name
