# The checks of the full verify protocol (`.claude/skills/verify/SKILL.md`, all but the Storybook build), the desktop
# app's Rust checks among them. One definition, called by `deploy.yml` before it ships a push to main and by `pr.yml`
# on a pull request that is ready for review, so what guards the deploy and what guards a merge cannot drift apart.
# It needs no secret and no environment: pull requests from forks run it too.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The desktop app's native side (packages/desktop/src-tauri). Its own job: it needs neither bun nor nzyme, only
  # Rust and the system libraries Tauri links on Linux.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      # Tauri v2's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      # `tauri::generate_context!()` reads the app's build folder (`build.frontendDist`) at compile time; the
      # checks do not need the app in it, only the folder.
      - name: The app's desktop build folder
        run: mkdir -p ../../app/.output-desktop/public

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # Everything but the test runs. The last two steps are what the deploy builds and bundles: a red there would block it
  # just like a red test.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The app's build includes the docs (`packages/docs`), whose "Updated" dates need the full history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Codegen is up to date
        run: |
          bun run codegen
          git diff --exit-code

      - name: TypeScript
        run: bun nx run-many -t typecheck --exclude='@nzyme/*' --skip-nx-cache

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Build the app
        run: bun --cwd packages/app build

      - name: Bundle the Worker
        run: bun --cwd packages/worker bundle

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Tests
        run: bun run tests

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      # The system libraries Chromium needs.
      - name: Install Chromium dependencies
        run: bunx playwright install-deps chromium

      - name: Component tests
        run: bun nx run-many -t test:stories --exclude='@nzyme/*' --skip-nx-cache

  # Shards rather than more workers on one machine: `retries` is 0 on purpose, and a loaded machine invites flaky tests.
  # Each shard builds the app itself (`webServer` in `packages/e2e/playwright.config.ts`): a build job the shards wait for
  # would use fewer runner minutes but add its time to the end-to-end time.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard must not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The app's build includes the docs (`packages/docs`), whose "Updated" dates need the full history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The system libraries Chromium needs.
      - name: Install Chromium dependencies
        run: bunx playwright install-deps chromium

      # Both projects: `web` against the local build, `desktop` against the desktop app's SPA (no Rust).
      - name: E2E
        run: bun run e2e --shard=${{ matrix.shard }}/3

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: packages/e2e/test-results/
          if-no-files-found: ignore
