# bun reads JSX options only from the bunfig.toml in the directory it runs from. These match
# nzyme/bunfig.toml, so nzyme's Vue `.tsx` tests also compile when run from this root.
jsx = "react"
jsxFactory = "h"
jsxFragment = "h"

# The app's code that runs under `bun test` is the web app's, as in the stories (`.storybook/main.ts`).
[define]
__DESKTOP__ = "false"
