kicker:
  en: One place
title:
  en: |-
    All your repositories,
    in one place.
body:
  en: 'You work in more repositories than ever, and with agents on the job, all of them are moving at once. GitHub gives each one its own pages. githq gives you one list: what’s waiting for your review, what’s ready to merge, what broke on main and what’s assigned to you.'
reviews:
  en: Reviews requested from you, front and center
pullRequests:
  en: 'Your pull requests: checks, reviews, mergeable'
workflows:
  en: Workflows failing on main, in any repository
issues:
  en: Issues assigned to you
alt:
  en: githq’s “My work” list across several repositories, opening with the workflows failing on main, then a review requested from you, your pull requests and the issues assigned to you.
