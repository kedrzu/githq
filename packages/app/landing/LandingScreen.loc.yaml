headline:
  en: |-
    Your GitHub issues,
    at the speed of thought.
subhead:
  en: githq is a keyboard-first task manager on top of GitHub Issues and Projects. Linear's speed, GitHub's data — free, open source, and nothing to keep in sync.
signIn:
  en: Sign in with GitHub
star:
  en: Star on GitHub
reassurance:
  en: No install · No new tracker · Nothing stored outside GitHub
permission:
  en: GitHub will ask for full repository access. githq only touches issues, pull requests and projects.
why:
  en: Why?
heroAlt:
  en: githq's "My work" list, with the issues and pull requests that need you across GitHub.
