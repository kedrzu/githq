headline:
  en: Everything on your plate across GitHub, one keystroke away.
lead:
  en: githq is a fast, keyboard-first client for GitHub Issues, pull requests and Projects. GitHub stays the only place your work lives.
signIn:
  en: Sign in with GitHub
asksTitle:
  en: What GitHub's next screen will ask for
asksRepositories:
  en: Full access to repositories
asksRepositoriesDetail:
  en: GitHub has nothing narrower for issues and pull requests. githq only reads and edits issues, pull requests, labels, milestones and comments. It never touches code, branches or settings.
asksProjects:
  en: Projects
asksProjectsDetail:
  en: To show and edit your GitHub Projects and their fields.
asksData:
  en: Where your data goes
asksDataDetail:
  en: Into this browser, and nowhere else. githq has no server that stores your issues.
asksShort:
  en: GitHub will ask for access to your repositories.
why:
  en: Why?
footerOpenSource:
  en: Free and open source
footerStaysOnGitHub:
  en: Your work stays on GitHub
cancelledTitle:
  en: Sign-in didn't finish
cancelledDetail:
  en: Access was cancelled on GitHub's screen, so nothing was shared with githq. Sign in again whenever you're ready.
failedTitle:
  en: Sign-in didn't finish
failedDetail:
  en: Something went wrong on the way back from GitHub, so githq isn't signed in. Try again; if it keeps happening, GitHub may be having trouble.
missingScopesTitle:
  en: githq didn't get the access it needs
missingScopesDetail:
  en: GitHub granted less than githq asked for, and without repositories, projects and organisations it can't show your work. Sign in again and allow all of it.
tokenRejectedTitle:
  en: You were signed out
tokenRejectedDetail:
  en: GitHub no longer accepts githq's access — it was revoked or has expired. Sign in again to carry on.
