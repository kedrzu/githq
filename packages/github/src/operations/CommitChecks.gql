# The checks of one commit as its details list them, by repository and sha. Apart from `CommitDetail`, which reads once
# a session, for checks change; and from `CommitStates`, for the rows on screen need only the rollup's state.
query CommitChecks($owner: String!, $name: String!, $rev: String!) {
    repository(owner: $owner, name: $name) {
        object(expression: $rev) {
            ... on Commit {
                statusCheckRollup {
                    contextPage: contexts(first: 100) {
                        totalCount
                        nodes {
                            ...PullRequestCheckFields
                        }
                    }
                }
            }
        }
    }
}
