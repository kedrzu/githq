  en: The run
theWorkflowStart:
  en: The workflow
detailNoPermission:
  en: "GitHub refused it: your role in {repository} can't {ability}. {outcome}"
detailTooOld:
  en: 'GitHub refused it: a run can be re-run for about a month after it ran. Nothing was started. A new commit or a manual run on GitHub starts a new one.'
detailAlreadyRunning:
  en: 'GitHub refused it: someone else re-ran it a moment ago. This page now follows that run.'
detailAlreadyFinished:
  en: 'GitHub refused it: the run finished before the cancel got there. githq now shows how it ended.'
detailOrganizationRestricted:
  en: "{organization} hasn't approved githq, so githq can read its public repositories but can't change anything there."
detailRefused:
  en: 'GitHub refused it: {message}. {outcome}'
detailUnreachable:
  en: "githq couldn't reach GitHub, so {thing} stays as GitHub last said it. Try again once you're online."
detailServerError:
  en: 'GitHub answered {status}, a failure on its side rather than a refusal. {thing} stays as GitHub last said it; try again in a moment.'
detailAllowance:
  en: "GitHub's API allowance is used up until {time}, so nothing was started."
detailAllowanceNotSent:
  en: "GitHub's API allowance is used up until {time}, so nothing was sent."
