# Releases the desktop app (packages/desktop). A manually dispatched action, run from main, with a `mode`:
# `preview` only prints the version and release notes the commits since the last stable tag would give and
# releases nothing; `stable` (`v0.2.0`) does. The version and the notes come from the Conventional Commits since the
# last stable tag (`packages/app/scripts/release.ts`). A release creates the tag on the commit it ran on and a draft
# GitHub release, builds macOS (Apple Silicon and Intel), Windows and Linux (`desktop-build.yml`), and uploads the
# installers, the signed updater bundles and the updater's `latest.json` to the draft. Publishing the draft is a separate
# step (`docs/desktop/RELEASING.md`); apps on the Stable stream look for updates at
# `releases/latest/download/latest.json`, so a release reaches them once it is published and GitHub's "latest"; so do the
# landing page's download links, `githq.dev/download/<build>`, which the Worker redirects to the latest release's
# installer by its versioned name (`packages/worker/src/download.ts`). Builds from main are `development.yml`.
#
# Secrets: `desktop-build.yml`.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview only prints the version and notes; stable tags and builds a draft release
        type: choice
        options: [preview, stable]
        default: preview
        required: true

# One release at a time: a tag made by one run is an input to the next run's version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Works out the version and the notes, and (except in a preview) makes the tag and the draft release once before
  # the platforms build: if each build created the draft, two finishing at once would make two drafts.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      # A release is cut from main only. And never re-run as a whole: a second attempt would compute a new version
      # for a commit the first already released.
      - name: Refuse a branch other than main and a re-run
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main; this run is on $GITHUB_REF"
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Do not re-run the whole release: use \"Re-run failed jobs\", or delete the tag this run left and start a new run"
            exit 1
          fi

      # The plan reads the tags and the whole history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Writes `tag` to GITHUB_OUTPUT unless this is a preview.
      - name: Plan the release
        id: plan
        run: bun packages/app/scripts/release.ts plan --mode "$MODE" --notes "$RUNNER_TEMP/notes.md"
        env:
          MODE: ${{ inputs.mode }}

      - name: Name the version
        id: version
        if: steps.plan.outputs.tag != ''
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.plan.outputs.tag }}

      # The tag first: tauri-action looks the release up by it. An existing tag fails the step.
      - name: Create the tag and the draft release
        id: release
        if: steps.plan.outputs.tag != ''
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="githq $TAG" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true \
            --jq .id)
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      release-id: ${{ needs.prepare.outputs.release-id }}
      # NSIS only on Windows: the updater replaces an NSIS install whatever its version.
      platforms: >-
        [
          {"runner": "macos-latest", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
          {"runner": "macos-latest", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin"},
          {"runner": "windows-latest", "target": "x86_64-pc-windows-msvc", "args": "--bundles nsis"},
          {"runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "args": "--bundles deb,appimage"}
        ]

  # An app on a platform missing from `latest.json` would never update, so the release fails instead.
  updater-json:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Drafts are visible only with write access.
    permissions:
      contents: write
    steps:
      - name: Check that latest.json covers every platform
        run: |
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "::error::The release has no latest.json"
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json
          jq '{version, platforms: (.platforms | keys)}' latest.json
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if ! jq -e --arg platform "$platform" '.platforms | has($platform)' latest.json > /dev/null; then
              echo "::error::latest.json has no $platform"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
