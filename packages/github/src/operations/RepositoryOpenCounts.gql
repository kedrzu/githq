# How many issues and pull requests of a repository are open on GitHub, read when an untracked repository's view
# says how many of them githq does not have (J3, CH37).
query RepositoryOpenCounts($owner: String!, $name: String!) {
    repository(owner: $owner, name: $name) {
        issues(states: OPEN) {
            totalCount
        }
        pullRequests(states: OPEN) {
            totalCount
        }
    }
}
