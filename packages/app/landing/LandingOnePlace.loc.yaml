body:
  en: Reviews waiting on you, your pull requests with their checks, workflows failing on main, the issues assigned to you. One list across every repository you track, instead of a tab per repository.
reviews:
  en: Reviews requested from you, front and center
pullRequests:
  en: 'Your pull requests: checks, reviews, mergeable'
workflows:
  en: Workflows failing on main, in any repository
issues:
