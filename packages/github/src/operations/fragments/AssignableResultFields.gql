# The assignees of an issue or pull request after a write; GitHub allows at most 10.
fragment AssignableResultFields on Assignable {
    ... on Issue {
        __typename
        id
        updatedAt
    }
    ... on PullRequest {
        __typename
        id
        updatedAt
    }
    assignees(first: 10) {
        nodes {
            id
            login
            avatarUrl
        }
    }
}
