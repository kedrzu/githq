eyebrow:
  en: The details
titleLine1:
  en: Small things that add up
titleLine2:
  en: to a tool you keep open.
swapTitle:
  en: Swap the host, keep the page
swapBody:
  en: Change github.com to githq.dev in any link and the same issue, pull request or list opens in githq. Anything githq doesn’t show hands you straight back to github.com.
swapBefore:
  en: The address on GitHub
swapAfter:
  en: The same address in githq
freeTitle:
  en: Free. Actually free.
freeBody:
  en: No seats, no plans, no trial that runs out. GitHub is the backend, so there is nothing for us to charge you for.
serverTitle:
  en: No server holds your work
serverBody:
  en: You sign in with GitHub and that’s it. Your work lives on GitHub and on your machine — githq has no database of its own.
limitTitle:
  en: Gentle on your API limit
limitBody:
  en: Change checks use GitHub’s conditional requests. When nothing changed, they don’t count against your hourly allowance.
installTitle:
  en: A real desktop app
installBody:
  en: macOS, Windows and Linux. githq in its own window, your token in the system keychain, and updates that install themselves.
anywhereTitle:
  en: Anywhere on GitHub
anywhereBody:
  en: The pull request you opened on someone else’s open-source project shows up too. If it concerns you, it’s in your work — no matter whose repository.
stacksTitle:
  en: Stacks read as one
stacksBody:
  en: A stack of pull requests is one entry in every list. Open any of them and the whole stack is beside it, each pull request with its checks and reviews.
