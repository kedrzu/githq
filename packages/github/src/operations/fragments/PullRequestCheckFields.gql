# One check of a commit as the opened item or commit lists it, shared by `PullRequestDetailFields`,
# `PullRequestMergeOptions` and `CommitChecks` so they all map it the same way.
fragment PullRequestCheckFields on StatusCheckRollupContext {
    ... on CheckRun {
        __typename
        id
        name
        status
        conclusion
        detailsUrl
        startedAt
        completedAt
        checkSuite {
            workflowRun {
                workflow {
                    name
                }
            }
        }
    }
    ... on StatusContext {
        __typename
        id
        context
        state
        targetUrl
        createdAt
    }
}
