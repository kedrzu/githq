title:
  en: Broken workflows
brokenIn:
  plural: repositories
  en:
    one: '{broken} in {repositories} repository'
    many: '{broken} in {repositories} repositories'
noneIn:
  plural: count
  en:
    one: none in {count} repository
    many: none in {count} repositories
soFarReading:
  plural: count
  en:
    one: '{broken} so far · reading {count} repository'
    many: '{broken} so far · reading {count} repositories'
reading:
  plural: count
  en:
    one: reading {count} repository
    many: reading {count} repositories
repositories:
  plural: count
  en:
    one: '{count} repository'
    many: '{count} repositories'
workflowsOfTracked:
  en: the workflows of {count} of your tracked repositories
workflowsOfAnyTracked:
  en: the workflows of {count} of your tracked repositories, so it can't tell what is broken there
noneShownTitle:
  en: GitHub doesn't show the workflows
noneShownDetail:
  plural: count
  en:
    one: GitHub shows nothing of the workflows of your tracked repository, so githq can't tell what is broken. It says why below.
    many: GitHub shows nothing of the workflows of any of your {count} tracked repositories, so githq can't tell what is broken. Each says why below.
openFailedRun:
  en: Open failed run
next:
  en: Next workflow
previous:
  en: Previous workflow
fresh:
  en: New
freshNote:
  en: broke in the last 24 hours
ongoing:
  en: Ongoing
cantTell:
  en: Can't tell
cantTellNote:
  en: not in the total
actionsOff:
  en: Actions turned off
actionsRefused:
  en: GitHub refused
actionsOffStatus:
  en: GitHub says Actions is disabled for this repository
actionsRefusedStatus:
  en: GitHub refused to show this repository's workflows ({status})
checkedAgo:
  en: checked {age} ago
allGreenTitle:
  en: All green, exit code 0
allGreenText:
  plural: count
  en:
    one: Every workflow that counts passes in the tracked repository. Nothing to fix, so go break something new. Failures on refs that don't count wait in the repository's Workflows section.
    many: Every workflow that counts passes in all {count} tracked repositories. Nothing to fix, so go break something new. Failures on refs that don't count wait in each repository's Workflows section.
allGreenTextPartly:
  en: Every workflow that counts passes in {read} of {tracked} tracked repositories; GitHub shows nothing of the others. Nothing to fix, so go break something new. Failures on refs that don't count wait in each repository's Workflows section.
allGreenDetail:
  en: '{read}/{tracked} repositories · 0 broken · read {age} ago'
nothingTrackedTitle:
  en: No repositories tracked
nothingTrackedText:
  en: Track a repository in Settings and its broken workflows show up here.
