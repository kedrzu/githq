refused:
  en: 'GitHub refused it: "{reason}". Your text is kept.'
refusedNoReason:
  en: GitHub refused it and gave no reason. Your text is kept.
notReached:
  en: GitHub wasn't reached, so it may not have got there. Your text is kept.
noDraft:
  en: Your draft isn't open anymore. Your text is kept.
draftFound:
  en: Your draft review is open, and a reply would have joined it, so nothing was sent. Your text is kept.
