# The fields of a pull request that change without its row being edited — CI, reviews, mergeability (D5) —
# re-read on their own by `PullRequestStatuses`.
fragment PullRequestStatusFields on PullRequest {
    __typename
    id
    updatedAt
    state
    isDraft
    merged
    reviewDecision
    mergeable
    mergeStateStatus
    # Joining or leaving a stack does not move `updatedAt`, so the stack is re-read here with the statuses.
    stack {
        id
        number
        size
    }
    stackEntry {
        position
    }
    # The commit a merge names (`sha`), so GitHub refuses it when the head moved since.
    headRefOid
    baseRefOid
    # The branch's follow-ups (merging D16): `headRef` is gone once it is deleted, and restoring it needs its repository.
    headRef {
        id
    }
    headRepository {
        id
    }
    isCrossRepository
    viewerCanDeleteHeadRef
    isMergeQueueEnabled
    mergeQueueEntry {
        position
        state
        estimatedTimeToMerge
        enqueuedAt
        enqueuer {
            login
        }
    }
    autoMergeRequest {
        mergeMethod
        enabledAt
        enabledBy {
            login
        }
        commitHeadline
    }
    baseRef {
        target {
            oid
        }
    }
    statusCheckRollup {
        state
        contexts {
            checkRunCountsByState {
                state
                count
            }
            statusContextCountsByState {
                state
                count
            }
        }
    }
    reviewRequests(first: 10) {
        nodes {
            requestedReviewer {
                ... on User {
                    login
                }
                ... on Team {
                    slug
                    name
                }
            }
        }
    }
    latestOpinionatedReviews(first: 10) {
        nodes {
            author {
                login
            }
            state
        }
    }
}
