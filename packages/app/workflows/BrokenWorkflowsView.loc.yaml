checkedAgo:
  en: checked {age} ago
allGreenTitle:
  en: All green, exit code 0
allGreenText:
  plural: count
  en:
    one: Every workflow that counts passes in the tracked repository. Nothing to fix, so go break something new. Failures on refs that don't count wait in the repository's Workflows tab.
    many: Every workflow that counts passes in all {count} tracked repositories. Nothing to fix, so go break something new. Failures on refs that don't count wait in each repository's Workflows tab.
allGreenDetail:
  en: '{read}/{tracked} repositories · 0 broken · read {age} ago'
nothingTrackedTitle:
  en: No repositories tracked
nothingTrackedText:
  en: Track a repository in Settings and its broken workflows show up here.
