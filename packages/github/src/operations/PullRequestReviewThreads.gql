# One page of a pull request's review threads, each with its first comments; `ReviewThreadComments` reads the rest of a
# longer one. On a thread with `subjectType: FILE` GitHub says `line: 1` and an empty `diffHunk`; on an outdated one
# `line` is `null` or a line of no use.
query PullRequestReviewThreads($owner: String!, $name: String!, $number: Int!, $after: String) {
    repository(owner: $owner, name: $name) {
        pullRequest(number: $number) {
            reviewThreads(first: 100, after: $after) {
                pageInfo {
                    hasNextPage
                    endCursor
                }
                nodes {
                    id
                    path
                    line
                    startLine
                    originalLine
                    originalStartLine
                    diffSide
                    startDiffSide
                    isOutdated
                    isResolved
                    subjectType
                    viewerCanReply
                    viewerCanResolve
                    viewerCanUnresolve
                    comments(first: 50) {
                        pageInfo {
                            hasNextPage
                            endCursor
                        }
                        nodes {
                            ...ReviewThreadCommentFields
                        }
                    }
                }
            }
        }
    }
}
