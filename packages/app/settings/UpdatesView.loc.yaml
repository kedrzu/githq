versionTitle:
  en: Version
version:
  en: githq {version}
stableVersion:
  en: Stable version
developmentBuild:
  en: Development build
developmentBuildFromCommit:
  en: Development build from commit {commit}
following:
  en: '{build}, following {stream}'
checkForUpdates:
  en: Check for updates
restart:
  en: Restart
tryAgain:
  en: Try again

checking:
  en: Checking for updates…
newestVersion:
  en: You're on the newest version
newestBuild:
  en: You're on the newest build
checkedJustNow:
  en: Checked just now.
checkedAgo:
  en: Checked {age}.
nothingNewer:
  en: Nothing newer than {version} yet
